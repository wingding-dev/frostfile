[project]
name = "identilock"
version = "0.2.0"
description = "Local-only tracker for credit freezes, identity controls, and breach exposure across a family."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Identilock contributors" }]
keywords = ["credit-freeze", "identity-theft", "privacy", "security"]
classifiers = [
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "cryptography>=42.0",
    "argon2-cffi>=23.1",
    "httpx>=0.27",
    "pypdf>=4.0",
    "pywebview>=5.0",
    "reportlab>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
identilock = "identilock.cli:main"

[project.urls]
Homepage = "https://github.com/yourname/identilock"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["identilock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
