# Builds FrostFile executables for Windows and macOS on every version tag.
#
# To use: push this repo to GitHub, then
#   git tag v1.0.0 && git push origin v1.0.0
# Artifacts appear under the workflow run (Actions tab) — download them,
# verify on a real machine, compute SHA-256, and upload to R2 by hand.
# Nothing here publishes anything automatically; releasing stays human.

name: build
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: FrostFile-windows
            binary: dist/FrostFile.exe
          - os: macos-latest
            artifact: FrostFile-macos
            binary: dist/FrostFile-mac.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install . pyinstaller
      - run: python -m pytest tests -q
      - run: pyinstaller build/frostfile.spec --noconfirm
      - if: runner.os == 'macOS'
        run: cd dist && zip -r FrostFile-mac.zip FrostFile.app
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}

  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: FrostFile-source
          path: dist/*
